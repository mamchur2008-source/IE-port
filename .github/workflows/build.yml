name: Build IE port

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Prepare sources
        run: bash scripts/prepare.sh

      - name: Compile
        working-directory: ie
        run: |
          set +e
          gradle jar compileDatagenJava --continue --no-daemon --console=plain 2>&1 | tee ../build.log
          echo "exit=${PIPESTATUS[0]}" > ../exit.txt

      - name: Collect errors
        if: always()
        run: |
          grep -E '\.java:[0-9]+: error' build.log | sed -E 's|^.*/ie/||' > errors.txt || true
          echo "errors: $(wc -l < errors.txt)" | tee summary.txt
          grep -E '\.java:[0-9]+: error' build.log | sed -E 's|^.*/ie/||; s|:[0-9]+: error:.*||' | sort | uniq -c | sort -rn | head -60 >> summary.txt || true
          cat summary.txt
          grep -vE '\.java:[0-9]+: error' build.log | grep -E 'FAILED|What went wrong|Could not|error:' | head -40 > other-errors.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            errors.txt
            summary.txt
            other-errors.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ImmersiveEngineering-jar
          path: ie/build/libs/*.jar
