plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "$version_mdg"
}

base {
    archivesName = 'ImmersiveEngineering'
}
version = "${version_minecraft}-${version_ie}-${version_buildnumber}-${version_port}"
group = 'blusunrize.immersiveengineering'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def version_replaces = [
        'version'      : project.version,
        'ie_version'   : "${version_ie}-${version_buildnumber}-${version_port}".toString(),
        'mc_version'   : version_minecraft,
        'forge_version': version_neoforge,
        'jei_version'  : version_jei,
]

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties version_replaces
    expand version_replaces
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
neoForge.ideSyncTask generateModMetadata

// api + manual are merged into main for the port, so that javac reports all errors in one go.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/api/java', 'src/manual/java', 'src/lib/java']
        }
        resources {
            srcDirs = ['src/main/resources', "$rootDir/src/generated/resources", generateModMetadata]
            exclude '.cache'
            exclude 'assets/immersiveengineering/lang_base'
        }
    }
    datagen {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

neoForge {
    version = version_neoforge

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            sourceSet = sourceSets.datagen
            programArguments.addAll '--mod', 'immersiveengineering', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        immersiveengineering {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // show every error, not just the first 100
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
